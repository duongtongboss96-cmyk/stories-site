<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recent Stories</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Thêm CSS riêng cho giao diện này */
    .story-card {
      border-bottom: 1px solid #eee;
      padding: 1.5rem 0;
      margin-bottom: 1rem;
    }
    .story-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .story-meta {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
    }
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.8rem;
    }
    .chapter-item {
      color: #0066cc;
      cursor: pointer;
      padding: 0.3rem 0;
    }
    .chapter-item:hover {
      text-decoration: underline;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
    }
    .back-btn, #nextChapter {
      color: #0066cc;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-size: 0.95rem;
    }
    .back-btn:hover, #nextChapter:hover {
      text-decoration: underline;
    }
    .chapter-content {
      margin-top: 1.5rem;
      line-height: 1.8;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="index.html" class="active">Recent Stories</a>
      <a href="#">Blog</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="container">
    <div id="storyList"></div>

    <div id="chapterView" style="display: none;">
      <button class="back-btn" id="backBtn">← Back to all stories</button>
      <h2 id="chapterTitle"></h2>
      <div class="chapter-content" id="chapterContent"></div>
      <div class="nav-buttons">
        <button class="back-btn" id="prevChapter">← Previous Chapter</button>
        <button id="nextChapter">Next Chapter →</button>
      </div>
    </div>
  </main>

  <script>
    let stories = [];
    let currentStory = null;
    let currentChapterIndex = 0;

    // Tải dữ liệu từ data.json
    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        stories = Array.isArray(data) ? data : [data];
        renderStoryList();
      })
      .catch(err => {
        document.getElementById('storyList').innerHTML = `
          <div class="story-card">
            <p style="color:red;">Lỗi: Kiểm tra tệp data.json đã tải lên đúng chưa</p>
            <p>${err}</p>
          </div>
        `;
      });

    function renderStoryList() {
      const container = document.getElementById('storyList');
      container.innerHTML = '';
      
      stories.forEach(story => {
        const card = document.createElement('div');
        card.className = 'story-card';
        card.innerHTML = `
          <time class="post-date">${story.date}</time>
          <h2 class="post-title">${story.title}</h2>
          <div class="story-meta">📚 ${story.totalChapters} chapters</div>
          <div class="chapter-list">
            ${story.chapters.map(ch => `
              <div class="chapter-item" data-story="${story.id}" data-chapter="${ch.number}">
                ${ch.title}
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll('.chapter-item').forEach(item => {
        item.addEventListener('click', () => {
          const storyId = item.getAttribute('data-story');
          const chapterNum = parseInt(item.getAttribute('data-chapter'));
          openChapter(storyId, chapterNum);
        });
      });
    }

    function openChapter(storyId, chapterNumber) {
      currentStory = stories.find(s => s.id === storyId);
      if (!currentStory) return;
      
      currentChapterIndex = currentStory.chapters.findIndex(c => c.number === chapterNumber);
      if (currentChapterIndex === -1) return;
      
      showCurrentChapter();
      
      document.getElementById('storyList').style.display = 'none';
      document.getElementById('chapterView').style.display = 'block';
    }

    function showCurrentChapter() {
      const chapter = currentStory.chapters[currentChapterIndex];
      document.getElementById('chapterTitle').textContent = chapter.title;
      document.getElementById('chapterContent').textContent = chapter.content;
      updateNavButtons();
    }

    function updateNavButtons() {
      const prevBtn = document.getElementById('prevChapter');
      const nextBtn = document.getElementById('nextChapter');
      
      prevBtn.style.visibility = currentChapterIndex > 0 ? 'visible' : 'hidden';
      nextBtn.style.visibility = currentChapterIndex < currentStory.chapters.length - 1 ? 'visible' : 'hidden';
    }

    // Nút quay lại
    document.getElementById('backBtn').addEventListener('click', () => {
      document.getElementById('storyList').style.display = 'block';
      document.getElementById('chapterView').style.display = 'none';
      currentStory = null;
      currentChapterIndex = 0;
    });

    // Điều hướng chương
    document.getElementById('prevChapter').addEventListener('click', () => {
      if (currentChapterIndex > 0) {
        currentChapterIndex--;
        showCurrentChapter();
      }
    });

    document.getElementById('nextChapter').addEventListener('click', () => {
      if (currentChapterIndex < currentStory.chapters.length - 1) {
        currentChapterIndex++;
        showCurrentChapter();
      }
    });
  </script>
</body>
</html>
